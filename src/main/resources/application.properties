spring.application.name=breakloop-backend

server.port=${PORT:8080}
server.address=0.0.0.0
# Admin key for POST /api/offline-activities/seed. Empty disables the endpoint (403).
# Set it through the environment; never commit a real value.
breakloop.admin.key=${BREAKLOOP_ADMIN_KEY:}

# Require a Firebase ID token on activity-logs and suggestion-interactions.
breakloop.auth.enabled=${BREAKLOOP_AUTH_ENABLED:true}
